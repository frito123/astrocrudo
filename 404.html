<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 • Esta página ya no existe • AstroCrudo</title>
    <meta name="description" content="La página que buscabas ha sido desmantelada o nunca existió. Astrología de la sombra.">
    
    <!-- Canonical -->
    <link rel="canonical" href="https://astrocrudo.netlify.app/404">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='85'>🜁</text></svg>">
    
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .font-serif {
            font-family: Georgia, "Times New Roman", serif;
            font-feature-settings: "kern";
        }
        .subtle-texture {
            background-image: 
                radial-gradient(#1f1a1a 0.8px, transparent 1px);
            background-size: 4px 4px;
            opacity: 0.6;
        }
    </style>
</head>
<body class="bg-[#0a0808] text-[#e5e0d8] min-h-screen flex flex-col">

    <!-- Minimal Navigation -->
    <nav class="border-b border-white/10">
        <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="/" class="font-serif text-2xl tracking-tight hover:text-[#c5b8a0] transition-colors">AstroCrudo</a>
            
            <a href="/" 
               class="text-sm tracking-wider border border-white/20 hover:border-white/40 px-5 h-10 rounded-full flex items-center transition-colors">
                Volver al sitio
            </a>
        </div>
    </nav>

    <!-- 404 Content -->
    <main class="flex-1 flex items-center justify-center px-6">
        <div class="max-w-2xl text-center">
            
            <!-- Subtle background texture -->
            <div class="absolute inset-0 subtle-texture pointer-events-none"></div>

            <div class="relative z-10 pt-4">
                <!-- Symbol -->
                <div class="text-[70px] sm:text-[90px] mb-2 sm:mb-4 opacity-60">🜁</div>

                <!-- 404 Number -->
                <div class="font-serif text-[90px] sm:text-[120px] md:text-[140px] leading-none tracking-[-6px] sm:tracking-[-8px] text-white mb-3 sm:mb-4">
                    404
                </div>

                <!-- Main Message -->
                <h1 class="font-serif text-3xl sm:text-4xl md:text-5xl tracking-[-1.5px] mb-5 sm:mb-6">
                    Este lugar ya no existe.
                </h1>

                <p class="max-w-md mx-auto text-[#c5b8a0] text-base sm:text-lg leading-relaxed mb-8 sm:mb-10">
                    La página que buscabas ha sido desmantelada, transformada o nunca llegó a existir. 
                    En este espacio, algunas cosas se disuelven… y otras renacen bajo otra forma.
                </p>

                <!-- CTA Buttons -->
                <div class="flex flex-col sm:flex-row gap-4 justify-center">
                    <a href="/" 
                       class="inline-flex items-center justify-center px-8 sm:px-9 h-12 sm:h-14 bg-[#8B0000] hover:bg-[#5c1a1a] transition-colors text-sm tracking-[1.5px] rounded-full font-medium">
                        VOLVER AL INICIO
                    </a>
                    
                    <a href="/#horoscopos" 
                       class="inline-flex items-center justify-center px-8 sm:px-9 h-12 sm:h-14 border border-white/30 hover:border-white/60 transition-colors text-sm tracking-[1.5px] rounded-full">
                        VER HORÓSCOPOS DE HOY
                    </a>
                </div>

                <p class="mt-10 sm:mt-12 text-xs tracking-[2px] text-white/30">
                    ASTROCRUDO — ASTROLOGÍA DE LA SOMBRA
                </p>
            </div>
        </div>
    </main>

</body>
</html>
